name: Deploy to Tencent Lighthouse

# www.english.power-knowledge.tech → 43.142.148.37（lhins-6i7vay90）/var/www/english
#
# 形态：零构建多页静态站 —— 仓库根即发布产物，服务器上是该仓库的 git clone。
#
# ── 同步方向（2026-11-10 定案）：CI 反向推送到服务器 ──────────────────
# 服务器出口到 github.com 的 HTTPS 长期被掐（TCP 443 可连、TLS 握手挂死，
# 实测 fetch 无限挂起 6 分钟），且服务器没有 deploy key、无法改走 SSH。
# 因此不由服务器去拉，而由本工作流 `git push` 到服务器仓库
# （服务器侧已设 receive.denyCurrentBranch=updateInstead，推送即更新工作区），
# 再 SSH 调用 deploy/update.sh 做 chmod + nginx -t + reload + 回环字节自检。
# 整条链路只依赖「runner → 服务器:22」，该方向实测已通。
#
# 所需 repository secrets（5 条，站群统一命名）：
#   LH_HOST      43.142.148.37
#   LH_USER      root
#   LH_ROOT      /var/www/english
#   LH_SSH_KEY   root 登录私钥全文（~/.ssh/pfc_ci，含 BEGIN/END 行）
#   LH_PORT      22
#
# ⚠️ 未配 secrets 时走「优雅跳过」——job 仍显示成功（假绿）。
#    判断是否真部署过，必须下钻步骤级，确认 `Deploy over SSH` 是 success 而非 skipped。
#
# ⚠️ 服务器工作区若有未提交改动，工作流会**拒绝推送并报错**（防止覆盖人工改动）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "lighthouse-english"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy → /var/www/english
    runs-on: ubuntu-latest
    steps:
      # 需要完整历史：本工作流要把提交反向 push 到服务器仓库
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check configuration
        id: cfg
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
          LH_USER: ${{ secrets.LH_USER }}
          LH_ROOT: ${{ secrets.LH_ROOT }}
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
        run: |
          missing=""
          [ -z "$LH_HOST" ]   && missing="$missing LH_HOST"
          [ -z "$LH_USER" ]   && missing="$missing LH_USER"
          [ -z "$LH_ROOT" ]   && missing="$missing LH_ROOT"
          [ -z "$LH_SSH_KEY" ] && missing="$missing LH_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=已跳过部署::缺少 secrets:$missing（本次不上传、不改动服务器）"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "配置齐备：$LH_USER@$LH_HOST:$LH_ROOT"
          fi

      - name: Deploy over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
          LH_USER: ${{ secrets.LH_USER }}
          LH_ROOT: ${{ secrets.LH_ROOT }}
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
          LH_PORT: ${{ secrets.LH_PORT }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${LH_PORT:-22}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$LH_SSH_KEY" > ~/.ssh/lh_key
          chmod 600 ~/.ssh/lh_key
          ssh-keyscan -p "$PORT" -H "$LH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_CMD="ssh -p $PORT -i $HOME/.ssh/lh_key -o BatchMode=yes -o ConnectTimeout=20 $LH_USER@$LH_HOST"

          # ── 护栏：目标目录必须是 english 仓库的 git clone ──────────────
          # LH_ROOT 写错会对着别的站点跑 update.sh，必须在上传前拦住。
          echo "::group::目标目录核验"
          $SSH_CMD "cd '$LH_ROOT' \
            && test -d .git && echo 'git repo: OK' \
            && test -f deploy/update.sh && echo 'update.sh: OK' \
            && test -f index.html && echo 'index.html: OK' \
            && git remote get-url origin"
          echo "::endgroup::"

          BEFORE=$($SSH_CMD "git -C '$LH_ROOT' rev-parse HEAD")
          echo "部署前服务器 HEAD: $BEFORE"

          # ── 服务器工作区必须干净，否则 updateInstead 会拒绝推送 ────────
          DIRTY=$($SSH_CMD "git -C '$LH_ROOT' status --porcelain")
          if [ -n "$DIRTY" ]; then
            echo "::error title=服务器工作区不干净，拒绝推送::"
            printf '%s\n' "$DIRTY"
            echo "推送会覆盖上述人工改动。请先在服务器上提交/还原，再重跑本工作流。"
            exit 1
          fi

          # ── 反向推送：runner → 服务器（唯一依赖的链路方向）────────────
          git remote remove lh 2>/dev/null || true
          git remote add lh "ssh://$LH_USER@$LH_HOST$LH_ROOT"
          git config core.sshCommand "ssh -p $PORT -i $HOME/.ssh/lh_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          git push --porcelain lh "HEAD:refs/heads/main"

          # ── 收尾：chmod 归一 + nginx -t + reload ─────────────────────
          $SSH_CMD "cd '$LH_ROOT' && bash deploy/update.sh"

          AFTER=$($SSH_CMD "git -C '$LH_ROOT' rev-parse HEAD")
          echo "部署后服务器 HEAD: $AFTER"
          echo "本次触发提交:      $TARGET_SHA"

          if [ "$AFTER" != "$TARGET_SHA" ]; then
            echo "::error title=部署未到位::服务器 HEAD ($AFTER) ≠ 触发提交 ($TARGET_SHA)。"
            exit 1
          fi
          echo "::notice title=部署完成::服务器已更新至 $AFTER"

      # 核验分层（技能 §五）：
      #   1  状态码 / 301 收敛 → 本步（runner 侧，公网）
      #   2b 磁盘真身 + 2c 经 vhost 取回 → 已下沉到 deploy/update.sh 内自检，
      #      上一步 SSH 调用它时若字节不符即 exit 1，本工作流随之失败。
      #   2  产物指纹 + 3 渲染简化版 → 本步标题/版本串断言
      # ⚠️ 本步只体检、不设门禁：公网偶发抖动不应把已成功的部署判红。
      - name: Verify live site (self-check, never blocks)
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
        run: |
          set +e
          BASE="https://www.english.power-knowledge.tech"

          # ── 1 状态码：公网 200，且 http:// 应收敛到 https ──────────────
          for path in "/" "/glossary/"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "$BASE$path")
            echo "HTTPS $path → $code"
            if [ "$code" != "200" ]; then
              echo "::warning title=核验存疑::$path 返回 $code（不影响本次部署）"
            fi
          done
          plain=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "http://www.english.power-knowledge.tech/")
          echo "HTTP  / → $plain（期望 301）"

          # ── 2/3 内容指纹：标题 + 版本串 ────────────────────────────────
          html=$(curl -sS -m 20 "$BASE/")
          if printf '%s' "$html" | grep -q '邮件英语学习站'; then
            echo "::notice title=核验通过::线上可达且标题命中"
          else
            echo "::warning title=核验存疑::线上可达但内容指纹未命中，可能是缓存"
          fi

          # 版本号从本次 checkout 里读，不写死 —— 写死会在每次改版本时假红。
          LOCAL_VER=$(grep -o 'app-version">v[0-9.]*' index.html | head -1 | sed 's/.*>//')
          LIVE_VER=$(printf '%s' "$html" | grep -o 'app-version">v[0-9.]*' | head -1 | sed 's/.*>//')
          echo "版本串 本地=$LOCAL_VER 线上=$LIVE_VER"
          if [ -n "$LOCAL_VER" ] && [ "$LOCAL_VER" = "$LIVE_VER" ]; then
            echo "版本串一致：$LIVE_VER"
          else
            echo "::warning title=版本串不一致::本地=$LOCAL_VER 线上=$LIVE_VER（可能是缓存或发布未到位）"
          fi
          exit 0
