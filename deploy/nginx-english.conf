# english.power-knowledge.tech —— 外贸英语学习站 · 主题一 邮件英语
#
# 形态：零构建多页静态站，仓库根即发布产物，落在 /var/www/english。
# 证书：站群通配证 pk-wildcard（*.power-knowledge.tech）已覆盖本站裸域。
# 对外只认裸域 english.power-knowledge.tech：
#   www.english.* 是二级子域，通配证盖不到，需单独签发（当前 DNS 也没有这条记录）。
#
# 更新方式：服务器上 git -C /var/www/english pull（见 deploy/update.sh），无需构建。

# ── 80：仅 ACME 挑战 + 跳 HTTPS ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name english.power-knowledge.tech;

    include snippets/acme.conf;

    access_log /var/log/nginx/english.access.log;
    error_log  /var/log/nginx/english.error.log;

    location / {
        return 301 https://english.power-knowledge.tech$request_uri;
    }
}

# ── 443：主站 ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name english.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/pk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # 续期时 LE 会经 HTTPS 取挑战文件，443 块没有这个路径就 404 → 续期失败
    include snippets/acme.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/english;
    index index.html;

    # 隐藏文件防护（.git、.env、.deployed-version 等），须排在正则 location 之前
    include snippets/security-hardening.conf;

    access_log /var/log/nginx/english.access.log;
    error_log  /var/log/nginx/english.error.log;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # 部署配置与仓库元数据不对外
    location ^~ /deploy/ { return 404; }

    # 图片长缓存。css/js **不设** expires：文件名没有指纹，长缓存会让改版后
    # 的用户看到旧样式；交给默认的 ETag / Last-Modified 协商，改完立刻生效。
    # 注意：location 里只要出现 add_header 就会顶掉外层那三条安全头，
    # 所以这里只用 expires，由 nginx 自动生成 Cache-Control。
    location ~* \.(png|svg|jpe?g|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # 多页站：不存在的路径真 404，不回落 index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
