# english.power-knowledge.tech —— 外贸英语学习站 · 主题一 邮件英语
#
# 形态：零构建多页静态站，仓库根即发布产物，落在 /var/www/english。
# 证书：裸域用站群通配证 pk-wildcard（*.power-knowledge.tech）；
#       www.english.* 是二级子域，通配证盖不到，单独签发 english-www。
# 对外只认 www.english.power-knowledge.tech：
#   裸域 443 → 301 → https://www.…；80 两种名字都 → 301 → https://www.…
#
# 更新方式：GitHub Actions 反向 push 到 /var/www/english 后调 deploy/update.sh 收尾
#           （服务器出口到 GitHub 的 HTTPS 被掐，故不由服务器拉取）。无需构建。

# ── 80：仅 ACME 挑战 + 跳 HTTPS ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name english.power-knowledge.tech www.english.power-knowledge.tech;

    include snippets/acme.conf;

    access_log /var/log/nginx/english.access.log;
    error_log  /var/log/nginx/english.error.log;

    location / {
        return 301 https://www.english.power-knowledge.tech$request_uri;
    }
}

# ── 443：裸域只做 301，把权重归到 www ────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name english.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/pk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # 续期时 LE 会经 HTTPS 取挑战文件，443 块没有这个路径就 404 → 续期失败
    include snippets/acme.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/english.access.log;
    error_log  /var/log/nginx/english.error.log;

    location / {
        return 301 https://www.english.power-knowledge.tech$request_uri;
    }
}

# ── 443：主站（www 是唯一规范地址）────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.english.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/english-www/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english-www/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    include snippets/acme.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/english;
    index index.html;

    # 隐藏文件防护（.git、.env、.deployed-version 等），须排在正则 location 之前
    include snippets/security-hardening.conf;

    access_log /var/log/nginx/english.access.log;
    error_log  /var/log/nginx/english.error.log;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # 部署配置与仓库元数据不对外
    location ^~ /deploy/ { return 404; }

    # 图片长缓存。css/js **不设** expires：文件名没有指纹，长缓存会让改版后
    # 的用户看到旧样式；交给默认的 ETag / Last-Modified 协商，改完立刻生效。
    # 注意：location 里只要出现 add_header 就会顶掉外层那三条安全头，
    # 所以这里只用 expires，由 nginx 自动生成 Cache-Control。
    location ~* \.(png|svg|jpe?g|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # ── 留言板反代（2026-11-10 补接）────────────────────────────────
    # 本站上线时漏配，站内没有留言入口、后台也看不到数据。
    # X-Site 由 nginx 覆盖写入，客户端自带的同名头会在此被替换，归属不可伪造。
    # 用 ^~ 是为了跳过下面的正则 location（图片缓存那条），避免将来正则变宽把它抢走。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Site            english;
        proxy_read_timeout 30s;
        client_max_body_size 12m;
    }

    # ── 地址规范化：对外一律不带 .html（2026-11-18）─────────────────────
    #   /index.html           → 301 → /
    #   /glossary/index.html  → 301 → /glossary/   （#hash 由浏览器跨跳转保留）
    #   /practice.html        → 301 → /practice
    #   /email/checklist.html → 301 → /email/checklist
    #
    # 为什么用 301：旧外链、书签、已收录的搜索结果都还指着 .html，
    # 让它们把权重与地址栏一起收敛到干净地址，而不是长期并存两份 URL。
    #
    # ⚠️ 关键坑（2026-11-18 实测踩到）：**不能只留 `index index.html`**
    #   index 指令是「内部 URI 跳转」，会重新走一遍 location 匹配：
    #   / → index → /index.html → 命中下面的 .html 正则 → 301 回 / → 死循环。
    #   实测 curl / 得到 301，浏览器报「重定向次数过多」。
    #   解法：目录请求单独用一个 ~ /$ location，靠 try_files 就地取 index.html，
    #   try_files 命中文件时不再做 URI 跳转，也就不会回头撞上正则。
    location = /index.html          { return 301 /; }
    location = /glossary/index.html { return 301 /glossary/; }
    location = /email/index.html    { return 301 /email/; }

    # 同一份内容的其它写法，一并收敛（避免出现第二、第三个可访问地址）
    location = /index          { return 301 /; }
    location = /glossary/index { return 301 /glossary/; }
    location = /email/index    { return 301 /email/; }
    # 尾斜杠不能就地服务：/admin/ 会把页面里的相对资源（assets/...）
    # 解析成 /admin/assets/...，整页无样式无脚本。admin.html 全是相对路径，没有余地。
    location = /admin/         { return 301 /admin; }

    # ── 词汇库页签：真路径而不是 #hash（2026-11-18）──────────────────
    #   /glossary/abbr · /glossary/words · /glossary/sentences
    # 三个页签共用同一份 glossary/index.html，前端按路径末段决定显示哪块面板。
    # 换成路径的理由：页签是「页面状态」，不是页内锚点（页面上根本没有 id="abbr"），
    # 挂个 # 既容易被误认为页内跳转，也不利于分享与收录。
    #
    # ⚠️ 必须用 alias 直接指文件，**不能**写 try_files $uri … /glossary/index.html：
    #    try_files 的最后一个参数是「内部 URI 跳转」，会重新走一遍 location 匹配，
    #    立刻撞上下面那条 `.html → 301` 正则，把 /glossary/words 301 回 /glossary/，
    #    页签永远打不开 —— 和 index 指令那个死循环是同一类坑（同一份文件里踩第二次了）。
    #    alias 在 = 精确匹配里直接返回文件内容，不发生 URI 跳转，也就撞不上正则。
    #
    # ⚠️ 还要显式写 default_type：alias 的 MIME 是按**请求 URI 的扩展名**判的，
    #    /glossary/abbr 没有扩展名 → 落到 default_type application/octet-stream
    #    → 浏览器直接下载文件而不是渲染页面（2026-11-18 临时实例实测发现，状态码 200 看不出问题）。
    location = /glossary/abbr      { alias /var/www/english/glossary/index.html; default_type text/html; }
    location = /glossary/words     { alias /var/www/english/glossary/index.html; default_type text/html; }
    location = /glossary/sentences { alias /var/www/english/glossary/index.html; default_type text/html; }

    # 旧名：quotes → sentences（第三个页签原来叫 /glossary/quotes，同日更名）。
    # 一律 301，别让两个地址并存 —— 与全站「一个页面只有一个地址」的口径保持一致。
    location = /glossary/quotes    { return 301 /glossary/sentences; }

    # 其余 *.html 统一去后缀。404.html 不在此列 —— 下面用 = 精确挡掉，
    # 否则 error_page 的内部跳转会先命中这条正则，把 404 页变成 301。
    location ~ ^(/.*)\.html$ {
        return 301 $1$is_args$args;
    }

    # 目录请求：就地取 index.html（不走 index 指令，理由见上）
    location ~ /$ {
        try_files $uri/index.html =404;
    }

    # 无后缀 → 同名 .html（/practice、/admin、/feedback、/email/checklist）。
    # $uri/ 只用来把「目录少写尾斜杠」的情形（/glossary）补齐成 /glossary/ 的 301，
    # 补完由上面那条 ~ /$ 服务，不会再回到这里。
    # 最后回落到 @section：处理 /email/checklist/check 这类「页内小节」地址。
    location / {
        try_files $uri $uri.html $uri/ @section;
    }

    # ── 页内小节：/<page>/<section> 回退到上一级页面的 .html（2026-11-18）──
    #   前端把 #check 改写成路径 /email/checklist/check，由这条把请求接住，
    #   否则直接访问或刷新会 404（页面本身还是同一份 HTML，滚动由 JS 负责）。
    #
    # ⚠️ 这里必须用 `rewrite … break`，不能改写成 /$1.html 之后再重新匹配 location：
    #    用 last 会重新走一遍 location，撞上上面的 `.html → 301` 正则，把这个地址
    #    301 成 /email/checklist，小节就丢了 —— 同一个坑在这个文件里踩了三次。
    #    break 表示「改完 URI 就地处理」，不再重新匹配。
    location @section {
        rewrite ^/(.+)/[^/]+$ /$1.html break;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
