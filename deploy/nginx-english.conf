# english.power-knowledge.tech —— 外贸英语学习站 · 主题一 邮件英语
#
# 形态：零构建多页静态站，仓库根即发布产物，落在 /var/www/english。
# 证书：裸域用站群通配证 pk-wildcard（*.power-knowledge.tech）；
#       www.english.* 是二级子域，通配证盖不到，单独签发 english-www。
# 对外只认 www.english.power-knowledge.tech：
#   裸域 443 → 301 → https://www.…；80 两种名字都 → 301 → https://www.…
#
# 更新方式：GitHub Actions 反向 push 到 /var/www/english 后调 deploy/update.sh 收尾
#           （服务器出口到 GitHub 的 HTTPS 被掐，故不由服务器拉取）。无需构建。

# ── 80：仅 ACME 挑战 + 跳 HTTPS ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name english.power-knowledge.tech www.english.power-knowledge.tech;

    include snippets/acme.conf;

    access_log /var/log/nginx/english.access.log;
    error_log  /var/log/nginx/english.error.log;

    location / {
        return 301 https://www.english.power-knowledge.tech$request_uri;
    }
}

# ── 443：裸域只做 301，把权重归到 www ────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name english.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/pk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # 续期时 LE 会经 HTTPS 取挑战文件，443 块没有这个路径就 404 → 续期失败
    include snippets/acme.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/english.access.log;
    error_log  /var/log/nginx/english.error.log;

    location / {
        return 301 https://www.english.power-knowledge.tech$request_uri;
    }
}

# ── 443：主站（www 是唯一规范地址）────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.english.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/english-www/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english-www/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    include snippets/acme.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/english;
    index index.html;

    # 隐藏文件防护（.git、.env、.deployed-version 等），须排在正则 location 之前
    include snippets/security-hardening.conf;

    access_log /var/log/nginx/english.access.log;
    error_log  /var/log/nginx/english.error.log;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # 部署配置与仓库元数据不对外
    location ^~ /deploy/ { return 404; }

    # 图片长缓存。css/js **不设** expires：文件名没有指纹，长缓存会让改版后
    # 的用户看到旧样式；交给默认的 ETag / Last-Modified 协商，改完立刻生效。
    # 注意：location 里只要出现 add_header 就会顶掉外层那三条安全头，
    # 所以这里只用 expires，由 nginx 自动生成 Cache-Control。
    location ~* \.(png|svg|jpe?g|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # ── 留言板反代（2026-11-10 补接）────────────────────────────────
    # 本站上线时漏配，站内没有留言入口、后台也看不到数据。
    # X-Site 由 nginx 覆盖写入，客户端自带的同名头会在此被替换，归属不可伪造。
    # 用 ^~ 是为了跳过下面的正则 location（图片缓存那条），避免将来正则变宽把它抢走。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Site            english;
        proxy_read_timeout 30s;
        client_max_body_size 12m;
    }

    # 后台地址去掉 .html 后缀（2026-11-11）：/admin → /admin.html
    # 用 try_files 做内部重写，浏览器地址栏保持 /admin；/admin.html 仍然可用（旧书签不失效）。
    # 注意 root 下的 /admin 没有同名目录，所以不会被 location / 的 =404 吃掉。
    location = /feedback {
        try_files /feedback.html =404;
    }

    # ── 2026-11-11 二次收敛：/admin 为唯一规范地址 ──
    # 上一版只做了「/admin 能打开」，于是同一份内容有两个可访问 URL。现在归一：
    #   · /admin.html —— 旧书签/外链仍能用，但 301 到 /admin，地址栏不再停在 .html；
    #   · /admin/    —— 必须转走，**不能就地服务**：尾斜杠会把页面里的相对资源
    #                   （assets/css/...、assets/js/...）解析成 /admin/assets/...，
    #                   整页无样式无脚本。admin.html 全是相对路径，这点没有余地。
    # 精确匹配（=）优先于下面的正则 location 与 location /，不必再加 ^~。
    location = /admin.html {
        return 301 /admin;
    }

    location = /admin/ {
        return 301 /admin;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    # 多页站：不存在的路径真 404，不回落 index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
